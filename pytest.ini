[pytest]
# Reporte HTML automatico en cada ejecucion
addopts = -v --html=reports/reporte.html --self-contained-html
markers =
    ui: pruebas de interfaz (Selenium)
    api: pruebas de API (Requests)
    e2e: flujo completo de punta a punta
# Logging a archivo
log_file = logs/suite.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
